# gitleaks: default rules plus a narrow allowlist for known false positives.
# Never add a real credential here: rotate it and remove it from history.
# (single [allowlist] table: gitleaks-action@v2 pins 8.24.x, which predates
# the [[allowlists]] array syntax)
[extend]
useDefault = true

[allowlist]
description = "synthetic redaction fixtures; xterm modifyOtherKeys escape sequences in term.go"
# redact tests build fake secrets at run time to exercise redact.go
paths = [
  '''(^|/)redact_test\.go$''',
  '''(^|/)review_fixes_test\.go$''',
  '''(^|/)debug_log_test\.go$''',
  # senhas sudo fictícias dos testes do consentimento (consent.go nunca as deixa sair da memória)
  '''(^|/)consent_scrub_test\.go$''',
  # quotes the fake ghp_abcdef... fixture of debug_log_test.go from an old scan
  '''^docs/research/security-review-oss\.md$''',
]
# CSI 27;m;13~ (shift/alt/ctrl+enter) is a key code, not a key
regexTarget = "line"
# API_TOKEN=abc123segredo is the fake credential of the `jazz eval real` fixture project
# (evalreal.go): the suite checks that the offline brain never prints it
regexes = ['''"27;[0-9];13".*modifyOtherKeys''', '''API_TOKEN=abc123segredo''']

# Privacy rules (2026-11-04): the repo is public; the maintainer's tailnet
# hostnames, home paths and messaging ids never belong in a commit.
[[rules]]
id = "jazz-tailnet-host"
description = "Tailscale tailnet hostname (private network)"
regex = '''[a-z0-9-]+\.taild[0-9a-z]+\.ts\.net'''
[[rules]]
id = "jazz-home-path"
description = "maintainer home directory path"
regex = '''/home/(jazz|h)(/|\b)'''
[[rules]]
id = "jazz-whatsapp-id"
description = "WhatsApp JID / LID"
regex = '''[0-9]{8,}@(s\.whatsapp\.net|lid)\b'''
